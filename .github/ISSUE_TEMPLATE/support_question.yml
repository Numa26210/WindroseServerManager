name: Support question
description: Ask for help with setup, configuration, or expected behavior.
title: "[Support]: "
labels: ["question", "needs-triage"]
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.7.0"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include server layout, install path type, Windrose+ state, and anything unusual like Docker, RDP, mapped drives, or antivirus.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Drag screenshots or paste relevant logs if useful.
